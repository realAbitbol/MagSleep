# TEMPORARY diagnostic — verifies that a self-signed "MagSleep Code Signing"
# identity works for codesign on the release runner (macOS 26) once the cert is
# trusted for code signing inside the ephemeral CI keychain. Answers: does
# add-trusted-cert work headless on the runner, and is the DR stable
# (certificate-anchored)? Run via workflow_dispatch, then delete this file.

name: Cert Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    env:
      MAGSLEEP_CERT_P12_BASE64: ${{ secrets.MAGSLEEP_CERT_P12_BASE64 }}
      MAGSLEEP_CERT_PASSWORD: ${{ secrets.MAGSLEEP_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: Import identity, trust it in the CI keychain, test signing
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p runner "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p runner "$KC"
          echo "$MAGSLEEP_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MAGSLEEP_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k runner "$KC"
          security list-keychains -d user -s "$KC"
          echo "=== extract + trust the cert for code signing (user domain, CI keychain) ==="
          openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -clcerts -nokeys -out "$RUNNER_TEMP/cert.crt" -passin "pass:$MAGSLEEP_CERT_PASSWORD"
          security add-trusted-cert -d -r trustRoot -k "$KC" -p codeSign "$RUNNER_TEMP/cert.crt"
          echo "=== find-identity -v (must now be VALID, not NOT_TRUSTED) ==="
          security find-identity -v -p codesigning "$KC"
          echo "=== sign a test artifact ==="
          printf 'test' > "$RUNNER_TEMP/signme.txt"
          codesign --force --sign "MagSleep Code Signing" "$RUNNER_TEMP/signme.txt"
          echo "=== designated requirement (must be certificate-anchored, not cdhash) ==="
          codesign -d --requirements - "$RUNNER_TEMP/signme.txt" 2>&1
