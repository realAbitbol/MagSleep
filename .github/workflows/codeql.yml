# Scheduled CodeQL analysis — replaces GitHub's default setup, which ran a
# full scan (Swift is ~20 min) on EVERY push and clustered 3× during releases
# (master + tag + CI commits), thrashing the Swift build into multi-hour stalls.
#
# This runs weekly (+ manual dispatch). The Swift analysis is the expensive one;
# the Actions/Python jobs are seconds. Default setup was disabled in favor of
# this so scans happen once a week, not on every push.

name: "CodeQL"

on:
  schedule:
    # Weekly: Mondays 03:00 UTC.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  security-events: write # upload the SARIF analysis results
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        language: ['actions', 'python', 'swift']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
