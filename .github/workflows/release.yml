# Releases: the CI-only release path.
#
# Releases are CI-only by policy: every published DMG is built from scratch on
# a GitHub runner (never on a maintainer's machine), VirusTotal-scanned with
# the VIRUSTOTAL_API_KEY repo secret, EdDSA-signed into the Sparkle appcast
# with the SPARKLE_EDDSA_KEY repo secret, bound to this workflow run by a
# Sigstore build attestation (actions/attest), and published — then the signed
# appcast is committed to master (the feed is served from GitHub raw).
#
# To release: write the CHANGELOG section, then `make release VERSION=X.Y.Z`
# (validates the section, bumps README/Makefile refs, commits, tags, pushes).
# The workflow does everything else. The local `make release` never builds or
# publishes — a locally built DMG can never reach users.
#
# The skip guard at the top means a tag that already has a release is a no-op.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # gh release create + the appcast commit back to master
  id-token: write # Sigstore OIDC for build attestation (actions/attest)
  attestations: write # persist the build provenance attestation

jobs:
  release:
    # Pinned (not macos-latest) for reproducible release bytes — the standard
    # images are Apple Silicon, which suits the arm64-only build.
    runs-on: macos-15
    env:
      VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
      SPARKLE_EDDSA_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
      # gh does not auto-read GITHUB_TOKEN in Actions — without GH_TOKEN the
      # publish step fails with exit 4.
      GH_TOKEN: ${{ github.token }}
    steps:
      # Full history: the appcast commit later lands on top of master.
      - uses: actions/checkout@v7 # v4 targets deprecated Node 20
        with:
          fetch-depth: 0

      - name: Resolve version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Strict X.Y.Z only — pre-release suffixes (v1.2.10-beta) are not
          # released, and the validated value is later interpolated unquoted
          # into shell, so it must be digits-and-dots only.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: tag must be vX.Y.Z (got ${GITHUB_REF_NAME})" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Skip the whole build when this tag's release already exists (avoids a
      # second EdDSA signature over different ZIP bytes, which Sparkle would
      # reject) — EXCEPT: if the release exists but master's feed doesn't
      # advertise it (a prior run failed mid-commit), repair the feed from the
      # published ZIP without rebuilding.
      - name: Skip or repair feed if release already exists
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG does not exist yet — proceeding with the build"
            exit 0
          fi
          # origin/master is already current (fetch-depth 0 checkout; the
          # local flow pushes the branch before the tag); refresh it anyway.
          git fetch origin >/dev/null
          if git show origin/master:appcast/appcast.xml 2>/dev/null | grep -q "$TAG"; then
            echo "release $TAG + feed already current — skipping"
            exit 0
          fi
          echo "release $TAG exists but the feed is stale — repairing (no rebuild)"
          # The Sparkle artifact (generate_appcast) is materialized by the
          # SwiftPM build; a fresh runner needs one before it can sign.
          if [ ! -x ".build/artifacts/sparkle/Sparkle/bin/generate_appcast" ]; then
            swift build -c release --arch arm64 >/dev/null
          fi
          REPAIR="$PWD/appcast-repair"
          rm -rf "$REPAIR"
          mkdir -p "$REPAIR"
          gh release download "$TAG" --repo realAbitbol/MagSleep \
            --pattern "MagSleep-$VERSION.zip" --dir "$REPAIR" >/dev/null
          awk -v hdr="## [$VERSION]" '
              index($0, hdr) == 1 { in_section = 1; next }
              in_section && substr($0, 1, 3) == "## " { exit }
              in_section
          ' CHANGELOG.md > "$REPAIR/MagSleep-$VERSION.md" || true
          git checkout -B master origin/master
          cp appcast/appcast.xml "$REPAIR/appcast.xml" 2>/dev/null || true
          ./scripts/sign-appcast.sh "$VERSION" "$REPAIR"
          cp "$REPAIR/appcast.xml" appcast/appcast.xml
          git config user.name "MagSleep Release Bot"
          git config user.email "magleep[bot]@users.noreply.github.com"
          git add appcast/appcast.xml
          if ! git diff --cached --quiet; then
            git commit -m "Repair Sparkle appcast for v$VERSION"
            git push origin master
          else
            echo "appcast already current after repair"
          fi
          exit 0

      - name: Show Swift toolchain
        run: swift --version

      # Mirrors `make release`: nothing is published unless tests pass.
      - name: Run tests
        run: swift test

      - name: Build app bundle
        run: scripts/build-app.sh "${{ steps.version.outputs.version }}"

      - name: Build DMG
        run: scripts/build-dmg.sh "${{ steps.version.outputs.version }}"

      # The ZIP is the Sparkle update archive (see scripts/release.sh).
      - name: Create Sparkle ZIP
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ditto -c -k --sequesterRsrc --keepParent dist/MagSleep.app "dist/MagSleep-$VERSION.zip"

      # Bind the DMG + ZIP to this exact workflow run with a Sigstore-signed
      # SLSA provenance attestation — anyone can verify "built by GitHub, not
      # locally" with: gh attestation verify MagSleep-X.Y.Z.dmg --owner
      # realAbitbol. The attestations show on the release page once the
      # artifacts are uploaded.
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/MagSleep-${{ steps.version.outputs.version }}.dmg
            dist/MagSleep-${{ steps.version.outputs.version }}.zip

      - name: VirusTotal scan
        id: vt
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          scripts/virustotal-scan.sh "dist/MagSleep-$VERSION.dmg" | tee vt.out
          echo "status=$(sed -n 's/^status=//p' vt.out | head -1)" >> "$GITHUB_OUTPUT"
          echo "verdict=$(sed -n 's/^verdict=//p' vt.out | head -1)" >> "$GITHUB_OUTPUT"
          echo "permalink=$(sed -n 's/^permalink=//p' vt.out | head -1)" >> "$GITHUB_OUTPUT"
          # Only present when the verdict is "completed" (the README badge).
          echo "badge=$(sed -n 's/^badge=//p' vt.out | head -1)" >> "$GITHUB_OUTPUT"

      # Release body = the CHANGELOG section for this version + the VirusTotal
      # proof. Fails the job (before anything is published) if the CHANGELOG
      # section is missing — same guard + extraction as scripts/release.sh.
      - name: Build release notes
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NOTES="$(awk -v hdr="## [$VERSION]" '
              index($0, hdr) == 1 { in_section = 1; next }
              in_section && substr($0, 1, 3) == "## " { exit }
              in_section
          ' CHANGELOG.md)"
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            echo "error: no CHANGELOG.md section found for [$VERSION]" >&2
            exit 1
          fi
          printf '%s\n' "$NOTES" > notes.md
          {
            echo ""
            if [ "${{ steps.vt.outputs.status }}" = "completed" ]; then
              echo "- VirusTotal scan of the DMG: [${{ steps.vt.outputs.verdict }}](${{ steps.vt.outputs.permalink }})"
            elif [ "${{ steps.vt.outputs.status }}" = "submitted" ]; then
              echo "- VirusTotal: submitted — [results pending](${{ steps.vt.outputs.permalink }})"
            elif [ "${{ steps.vt.outputs.status }}" = "skipped" ]; then
              echo "- VirusTotal: scan skipped"
            else
              echo "- VirusTotal: scan failed"
            fi
          } >> notes.md

      # Sign the appcast with the SPARKLE_EDDSA_KEY secret (piped via
      # --ed-key-file - so the key never lands in a file or the process list),
      # seeded from the committed appcast so prior entries are kept. Shared
      # signing logic + guards (URL rewrite, EdDSA-signature assertion) live
      # in scripts/sign-appcast.sh.
      - name: Sign Sparkle appcast
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ROOT="$(pwd -P)"
          STAGE="$ROOT/appcast-staging"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp "dist/MagSleep-$VERSION.zip" "$STAGE/"
          if [ -f appcast/appcast.xml ]; then
            cp appcast/appcast.xml "$STAGE/appcast.xml"
          fi
          # Same release-notes file name convention as scripts/release.sh.
          awk -v hdr="## [$VERSION]" '
              index($0, hdr) == 1 { in_section = 1; next }
              in_section && substr($0, 1, 3) == "## " { exit }
              in_section
          ' CHANGELOG.md > "$STAGE/MagSleep-$VERSION.md"
          ./scripts/sign-appcast.sh "$VERSION" "$STAGE"

      - name: Publish GitHub Release
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          # Belt-and-suspenders (the early skip step already guards this):
          # never clobber a release the local `make release` created while
          # this job was building.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — skipping"
            exit 0
          fi
          gh release create "$TAG" \
            "dist/MagSleep-$VERSION.dmg" "dist/MagSleep-$VERSION.zip" \
            --title "MagSleep $VERSION" \
            --notes-file notes.md

      # Committed AFTER the release exists, so master never advertises a
      # release asset that isn't live yet (a publish failure leaves the feed
      # untouched). Also publishes the VirusTotal proof: the README badge
      # (between the VT_BADGE markers) and the CHANGELOG proof line — the old
      # release.sh did this locally; now CI does it. GITHUB_TOKEN pushes do not
      # re-trigger workflows.
      - name: Commit appcast + VirusTotal proof to master
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "MagSleep Release Bot"
          git config user.email "magleep[bot]@users.noreply.github.com"
          git checkout -B master origin/master
          cp appcast-staging/appcast.xml appcast/appcast.xml

          if [ "${{ steps.vt.outputs.status }}" = "completed" ]; then
            VT_LABEL="${{ steps.vt.outputs.verdict }}"
          elif [ "${{ steps.vt.outputs.status }}" = "submitted" ]; then
            VT_LABEL="submitted — results pending"
          elif [ "${{ steps.vt.outputs.status }}" = "skipped" ]; then
            VT_LABEL="scan skipped"
          else
            VT_LABEL="scan failed"
          fi
          # Same logic the old release.sh ran locally, extracted to a testable
          # script (idempotent: the CHANGELOG line is not duplicated on re-runs).
          python3 scripts/apply-vt-proof.py \
            "$VERSION" "${{ steps.vt.outputs.badge }}" "$VT_LABEL" "${{ steps.vt.outputs.permalink }}"

          git add appcast/appcast.xml README.md CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "Update appcast and VirusTotal proof for v$VERSION"
            git push origin master
          else
            echo "no changes to commit — appcast + proof already current"
          fi
