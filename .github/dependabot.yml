# Keeps the pinned GitHub Action SHAs (and the SwiftPM dependencies) current.
#
# Workflow actions are pinned to commit SHAs rather than mutable major tags
# (see the comment in release.yml): the release job holds the app's Sparkle
# update-signing key, so "v4" silently becoming different code is a real risk.
# Dependabot raises a PR when a pinned SHA moves within its major version.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # `github/codeql-action` is consumed as three subpaths (init, autobuild,
    # analyze). They live in ONE repository and must all resolve to the same
    # commit — CodeQL requires matching versions — so they are grouped into a
    # single PR. Without this, Dependabot opens one PR per subpath and merging
    # just one leaves the workflow on mixed versions.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
